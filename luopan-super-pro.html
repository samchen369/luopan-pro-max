<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sam.K 三盤超級專業藏版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap');
:root{--gold:#D4AF37;--bg:#050505}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Noto Serif TC",serif}
body{background:radial-gradient(ellipse at center,#121212 0%,#050505 100%);color:#eee;display:flex;flex-direction:column;align-items:center;padding:0 10px 20px;min-height:100vh}
.banner{width:100%;max-width:560px;height:118px;background:#000;border:1px solid #222;border-top:none;border-radius:0 0 18px 18px;overflow:hidden;position:relative;margin-bottom:10px}
.banner img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;right:10px;bottom:8px;background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.3);color:#D4AF37;font-size:10px;padding:3px 8px;border-radius:999px}
.card{width:100%;max-width:560px;background:linear-gradient(180deg,#151515,#0e0e0e);border:1px solid #222;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
canvas{width:100%;aspect-ratio:1;display:block;border-radius:50%;background:radial-gradient(circle at center,#101010 0%, #080808 60%, #050505 100%)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{padding:7px 12px;border-radius:999px;border:1px solid #333;background:#1d1d1d;color:#ddd;font-size:12px}
.btn-gold{background:#D4AF37;color:#111;border-color:#D4AF37;font-weight:800}
.btn-on{border-color:#D4AF37;color:#D4AF37;background:rgba(212,175,55,.15)}
.info{display:flex;justify-content:space-around;text-align:center;margin:10px 0}
.info b{color:#D4AF37;font-size:14px}.info span{font-size:10px;opacity:.5;display:block}
.zgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.zgrid button{padding:8px 0;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#bbb;font-size:12px}
.zgrid button.active{border-color:#D4AF37;color:#FFD86A;background:rgba(212,175,55,.18);font-weight:700}
.six{border:1px solid rgba(212,175,55,.15);background:linear-gradient(180deg,#17150e,#12120f);border-radius:14px;padding:14px;margin-bottom:8px}
.six h4{color:#D4AF37;font-size:13px}.six small{opacity:.45;font-size:10px;display:block;margin:3px 0 6px}.six p{font-size:12.5px;line-height:1.85;opacity:.92}
.toggle{display:flex;gap:6px;margin-top:6px}
.tag{display:inline-block;padding:1px 6px;border-radius:999px;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.18);font-size:9px;color:#D4AF37;margin-left:5px}
</style>

<div class="row"><button class="btn btn-gold" id="en">啟用感測器</button><button class="btn" id="lk">鎖定</button><button class="btn" id="trueBtn">真北校正:關</button><input id="decl" type="number" step="0.1" value="-4.2" style="width:72px;background:#111;border:1px solid #333;border-radius:8px;color:#D4AF37;padding:6px;font-size:12px"><span style="font-size:10px;opacity:.5">台灣-4.2°</span></div>
<div class="row"><input id="sl" type="range" min="0" max="360" step="0.1" value="0" style="flex:1"><input id="inDeg" type="number" placeholder="度數" style="width:80px;background:#111;border:1px solid #333;border-radius:8px;color:#fff;padding:6px"><button class="btn" id="ap">套用</button></div>
<div class="toggle"><button class="btn btn-on" id="t24">24山</button><button class="btn btn-on" id="t28">28宿</button><button class="btn btn-on" id="t72">72穿山</button><button class="btn btn-on" id="t60">60透地</button></div>
<div id="dbg" style="font-size:10px;color:#555;margin-top:6px">藏版含三盤與磁偏角，https開，遠離鐵器</div>
</div>
<div class="card"><div style="color:#D4AF37;font-weight:700;font-size:12px">十二生肖 · 選後才出六門 <span class="tag">藏版不主動選</span></div><div class="zgrid" id="zg"></div></div>
<div id="sixWrap" style="width:100%;max-width:560px"></div>
<div class="card" style="opacity:.6"><small style="font-size:10px;line-height:1.7"><b style="color:#D4AF37">藏版說明</b><br>地盤正針格龍立向，人盤中針撥砂看人丁，天盤縫針納水看財水。真北校正台灣-4.2°。28宿、72穿山、60透地龍皆備。緣者得之，不收費。冥冥之中自有定數。</small></div>
<script>
const MOUNTS=["子","癸","丑","艮","寅","甲","卯","乙","辰","巽","巳","丙","午","丁","未","坤","申","庚","酉","辛","戌","乾","亥","壬"];
const DIRS=["正北","北偏東","東北","東北偏東","東偏北","正東","東偏南","東南偏東","東南","南南東","南偏東","正南","南偏西","西南偏西","西南","西南偏西","西偏南","正西","西偏北","西北偏西","西北","西北偏北","北偏西","正北偏西"];
const BAGUA=["坎","艮","震","巽","離","坤","兌","乾"];
const CARD=["北","東北","東","東南","南","西南","西","西北"];
const ZOD=["鼠","牛","虎","兔","龍","蛇","馬","羊","猴","雞","狗","豬"];
const EARTH=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const STARS28=["角","亢","氐","房","心","尾","箕","斗","牛","女","虛","危","室","壁","奎","婁","胃","昴","畢","觜","參","井","鬼","柳","星","張","翼","軫"];
const WEALTH=["北方","北方+東北","東北+東","正東","東南","正南","南+西南","西南","西+西北","正西","西北","北方+西北"];
const PEACH=["西","南","東","北","西","南","東","北","西","南","東","北"];
const CONFLICT=["正南","西南","西南偏西","正西","西北","西北偏北","正北","東北","東北偏東","正東","東南偏東","東南"];
const STUCK={"鼠":["怕犯錯不敢動","錢一直流存不住","人來了不敢接"],"牛":["硬撐不轉彎","一直做沒人看見","錢袋子堆雜物"],"虎":["衝太快沒煞車","脾氣上來講太重"],"兔":["怕得罪人不敢說不","選項太多不敢選"],"龍":["想很大做很小","想被看見沒舞台"],"蛇":["悶心裡不講","想太多睡不好"],"馬":["跑太快沒方向","靜不下來一直滑"],"羊":["太軟不敢拒絕","被一句話卡三天"],"猴":["點子多做不完","三分鐘熱度"],"雞":["挑太細累死自己","嘴快講完後悔"],"狗":["太講義氣被凹","什麼都自己扛"],"豬":["太舒服不想動","家裡亂氣不順"]};
let selected=-1,target=0,filtered=0,offset=0,locked=false,hasSensor=false,trueNorth=false,decl=-4.2,show24=true,show28=true,show72=true,show60=true;
function mIdx(d){return Math.floor((((d%360)+360)%360+7.5)/15)%24;}
function degN(d){return (d%360+360)%360;}
function draw(a){
 const base=degN(a+offset+(trueNorth?decl:0));
 const c=document.getElementById('lp'),ctx=c.getContext('2d');
 ctx.clearRect(0,0,900,900);ctx.fillStyle="#080808";ctx.fillRect(0,0,900,900);
 ctx.save();ctx.translate(450,450);
 for(let i=0;i<360;i++){const rad=(i-90)*Math.PI/180;const r1=i%5==0?395:390;const r2=400;ctx.beginPath();ctx.moveTo(Math.cos(rad)*r1,Math.sin(rad)*r1);ctx.lineTo(Math.cos(rad)*r2,Math.sin(rad)*r2);ctx.strokeStyle=i%15==0?"rgba(212,175,55,.6)":i%5==0?"rgba(212,175,55,.25)":"rgba(212,175,55,.08)";ctx.lineWidth=i%15==0?1.2:.5;ctx.stroke();}
 const plates=[{name:"正針",off:0,r1:285,r2:400},{name:"中針",off:7.5,r1:250,r2:285},{name:"縫針",off:-7.5,r1:210,r2:250}];
 plates.forEach(p=>{
  ctx.save();ctx.rotate((-base + p.off)*Math.PI/180);
  ctx.beginPath();ctx.arc(0,0,p.r2,0,Math.PI*2);ctx.strokeStyle=p.name=="正針"?"rgba(212,175,55,.25)":p.name=="中針"?"rgba(100,180,255,.25)":"rgba(255,120,120,.25)";ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,p.r1,0,Math.PI*2);ctx.strokeStyle="rgba(255,255,255,.06)";ctx.stroke();
  if(show24){
   for(let i=0;i<24;i++){const deg=i*15,rad=(deg-90)*Math.PI/180;const mid=(p.r1+p.r2)/2;const x=Math.cos(rad)*mid,y=Math.sin(rad)*mid;ctx.save();ctx.translate(x,y);let rot=rad+Math.PI/2;if(deg>90&&deg<270)rot+=Math.PI;ctx.rotate(rot);ctx.fillStyle=i%3==0?"#FFD86A":(p.name=="正針"?"#D4AF37":p.name=="中針"?"#8abfff":"#ff9999");ctx.font=(i%3==0?700:400)+" "+(p.name=="正針"?(i%3==0?14:10):9)+"px serif";ctx.textAlign="center";ctx.fillText(MOUNTS[i],0,0);ctx.restore();}
  }
  ctx.restore();
 });
 if(show28){
  ctx.save();ctx.rotate((-base)*Math.PI/180);
  for(let i=0;i<28;i++){const deg=i*360/28,rad=(deg-90)*Math.PI/180;const x=Math.cos(rad)*195,y=Math.sin(rad)*195;ctx.save();ctx.translate(x,y);let rot=rad+Math.PI/2;if(deg>90&&deg<270)rot+=Math.PI;ctx.rotate(rot);ctx.fillStyle="#8888bb";ctx.font="10px serif";ctx.textAlign="center";ctx.fillText(STARS28[i],0,0);ctx.restore();}
  ctx.restore();
 }
 if(show72){
  ctx.save();ctx.rotate((-base)*Math.PI/180);
  for(let i=0;i<72;i++){const deg=i*5,rad=(deg-90)*Math.PI/180;const x=Math.cos(rad)*150,y=Math.sin(rad)*150;ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fillStyle=i%3==0?"#D4AF37":"rgba(212,175,55,.12)";ctx.fill();}
  ctx.restore();
 }
 if(show60){
  ctx.save();ctx.rotate((-base)*Math.PI/180);
  for(let i=0;i<60;i++){const deg=i*6,rad=(deg-90)*Math.PI/180;const x=Math.cos(rad)*135,y=Math.sin(rad)*135;ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fillStyle=i%10==0?"#FFD86A":"rgba(255,255,255,.15)";ctx.fill();}
  ctx.restore();
 }
 ctx.save();ctx.rotate((-base)*Math.PI/180);
 for(let i=0;i<8;i++){const deg=i*45,rad=(deg-90)*Math.PI/180;const x=Math.cos(rad)*95,y=Math.sin(rad)*95;ctx.save();ctx.translate(x,y);ctx.fillStyle="#666";ctx.font="700 11px sans-serif";ctx.textAlign="center";ctx.fillText(CARD[i],0,0);ctx.restore();const x2=Math.cos(rad)*70,y2=Math.sin(rad)*70;ctx.save();ctx.translate(x2,y2);ctx.fillStyle="#444";ctx.font="10px serif";ctx.textAlign="center";ctx.fillText(BAGUA[i],0,0);ctx.restore();}
 ctx.restore();
 ctx.restore();
 ctx.save();ctx.translate(450,450);
 ctx.fillStyle="#e74c3c";ctx.beginPath();ctx.moveTo(0,-415);ctx.lineTo(-9,-25);ctx.lineTo(9,-25);ctx.closePath();ctx.fill();
 ctx.fillStyle="#777";ctx.beginPath();ctx.moveTo(0,415);ctx.lineTo(-7,25);ctx.lineTo(7,25);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.arc(0,0,62,0,Math.PI*2);ctx.fillStyle="#0a0a0a";ctx.fill();ctx.strokeStyle="#D4AF37";ctx.lineWidth=1.5;ctx.stroke();
 ctx.fillStyle="#D4AF37";ctx.font="700 26px serif";ctx.textAlign="center";ctx.fillText(base.toFixed(1)+"°",0,-8);
 let label=trueNorth?"真北 "+base.toFixed(1)+"°":"磁北 "+base.toFixed(1)+"°";
 ctx.fillStyle=trueNorth?"#8abfff":"#888";ctx.font="10px sans-serif";ctx.fillText(label,0,10);
 ctx.fillStyle="#888";ctx.font="11px sans-serif";ctx.fillText(MOUNTS[(mIdx(base)+12)%24]+"山"+MOUNTS[mIdx(base)]+"向",0,26);
 ctx.restore();
 document.getElementById('d1').innerText=base.toFixed(1)+"° "+(trueNorth?"真":"磁");
 document.getElementById('d2').innerText=MOUNTS[mIdx(base)]+"山";
 document.getElementById('d3').innerText=MOUNTS[mIdx(degN(base-7.5))]+"山 中";
 document.getElementById('d4').innerText=MOUNTS[mIdx(degN(base+7.5))]+"山 縫";
 renderSix(base);
}
function renderSix(eff){
 const wrap=document.getElementById('sixWrap');
 if(selected===-1){wrap.innerHTML='<div class="six"><h4>請先選生肖</h4><p style="opacity:.6">藏版需選生肖才出六門，點上面十二生肖任一。</p></div>';return;}
 const idx=mIdx(eff),facing=MOUNTS[idx],sitting=MOUNTS[(idx+12)%24],dir=["正北","北偏東","東北","東北偏東","東偏北","正東","東偏南","東南偏東","東南","南南東","南偏東","正南","南偏西","西南偏西","西南","西南偏西","西偏南","正西","西偏北","西北偏西","西北","西北偏北","北偏西","正北偏西"][idx],z=ZOD[selected];
 const wealth=WEALTH[selected],peach=PEACH[selected],conflict=CONFLICT[selected];
 const stuck=STUCK[z][(idx+selected)%3];
 wrap.innerHTML='<div class="six"><h4>1 巒頭藏風 <span class="tag">地盤正針</span></h4><small>面朝'+facing+'山'+eff.toFixed(1)+'° '+dir+'</small><p>面朝<b style="color:#FFD86A">'+dir+' '+facing+'山</b>，'+(trueNorth?'真北':'磁北')+eff.toFixed(1)+'°。地盤正針格龍立向。</p></div><div class="six"><h4>2 玄空飛星 <span class="tag">天盤縫針</span></h4><small>九運 · 縫針納水 · 屬'+z+'</small><p>屬'+z+'，8白在東。縫針 '+MOUNTS[mIdx(degN(eff+7.5))]+'山見水為財，'+wealth+'保持亮。</p></div><div class="six"><h4>3 八宅三合 <span class="tag">人盤中針</span></h4><small>屬'+z+' · 中針看人丁</small><p>錢袋子<b>'+wealth+'</b> · 人緣正'+peach+' · 吵架位'+conflict+'。中針 '+MOUNTS[mIdx(degN(eff-7.5))]+'山撥砂。</p></div><div class="six"><h4>4 擇日 <span class="tag">72穿山</span></h4><small>穿山虎</small><p>72穿山分金，'+facing+'山，適合打掃'+wealth+'。</p></div><div class="six"><h4>5 奇門陽宅 <span class="tag">60透地</span></h4><small>透地龍第'+(Math.floor(eff/6)+1)+'龍</small><p>透地龍主地氣，大門在'+dir+'，床不壓'+conflict+'。</p></div><div class="six" style="border-color:#D4AF37"><h4>6 易占·卡點 <span class="tag">'+STARS28[Math.floor((eff/360)*28)]+'宿</span></h4><small>屬'+z+' · '+facing+'山'+eff.toFixed(1)+'°</small><p style="color:#FFD86A;font-weight:800">屬'+z+'，轉到'+facing+'山'+eff.toFixed(1)+'°，卡在「'+stuck+'」。</p><p style="margin-top:6px">人緣正'+peach+'，財在'+wealth+'，少在'+conflict+'吵。</p></div>';
}
function anim(){if(!locked){filtered=filtered*0.85+target*0.15;draw(filtered);}requestAnimationFrame(anim);}anim();
const zg=document.getElementById('zg');ZOD.forEach((z,i)=>{const b=document.createElement('button');b.innerText=z;b.onclick=()=>{selected=i;document.querySelectorAll('#zg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(filtered);};zg.appendChild(b);});
document.getElementById('en').onclick=()=>{const h=e=>{let hh=e.webkitCompassHeading;if(hh==null&&e.alpha!=null)hh=360-e.alpha;if(hh!=null){hasSensor=true;target=(hh+offset+360)%360;}};if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted'){window.addEventListener('deviceorientation',h,true);document.getElementById('en').innerText='已啟用';}});}else{window.addEventListener('deviceorientation',h,true);document.getElementById('en').innerText='已啟用';}};
document.getElementById('lk').onclick=()=>{locked=!locked;document.getElementById('lk').innerText=locked?'解鎖':'鎖定';if(!locked)anim();};
document.getElementById('ap').onclick=()=>{const v=parseFloat(document.getElementById('inDeg').value);if(!isNaN(v)){if(hasSensor)offset=v-target;else{target=v;filtered=v;}draw(filtered);}};
document.getElementById('sl').oninput=e=>{const v=parseFloat(e.target.value);if(hasSensor)offset=v-target;else{target=v;filtered=v;}draw(filtered);};
document.getElementById('trueBtn').onclick=function(){trueNorth=!trueNorth;this.innerText=trueNorth?'真北校正:開':'真北校正:關';this.classList.toggle('btn-on',trueNorth);decl=parseFloat(document.getElementById('decl').value)||-4.2;draw(filtered);};
document.getElementById('decl').oninput=e=>{decl=parseFloat(e.target.value)||0;if(trueNorth)draw(filtered);};
document.getElementById('t24').onclick=function(){show24=!show24;this.classList.toggle('btn-on',show24);draw(filtered);};
document.getElementById('t28').onclick=function(){show28=!show28;this.classList.toggle('btn-on',show28);draw(filtered);};
document.getElementById('t72').onclick=function(){show72=!show72;this.classList.toggle('btn-on',show72);draw(filtered);};
document.getElementById('t60').onclick=function(){show60=!show60;this.classList.toggle('btn-on',show60);draw(filtered);};
draw(0);
</script>
</body>
</html>
