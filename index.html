<!DOCTYPE html>

<style>
  :root {
    --bg: #0d0d0f; --card: #16161a; --border: #2a2a30; --text: #e8e8ec;

    --danger: #ef4444; --tag-bg: #1e3a5f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; overflow-x: hidden; }
  body { display: flex; flex-direction: column; min-height: 100dvh; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
    background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
  header h1 { font-size: 1.0rem; font-weight: 600; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
    background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; }
  main { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 12px; max-width: 540px; margin: 0 auto; width: 100%; }
  .compass-card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .compass-wrapper { position: relative; width: min(86vw, 340px); height: min(86vw, 340px); }
  canvas#luopan { width: 100%; height: 100%; border-radius: 50%; background: #0a0a0c;
    box-shadow: 0 0 0 2px #333, inset 0 0 40px rgba(0,0,0,0.8); }
  .center-needle { position: absolute; top: 50%; left: 50%; width: 4px; height: 28%; margin-left: -2px; margin-top: -28%;
    background: linear-gradient(to bottom, var(--danger) 0%, var(--danger) 45%, transparent 45%); border-radius: 2px; pointer-events: none; z-index: 5; }
  .center-dot { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    background: var(--gold); border-radius: 50%; border: 2px solid #fff; z-index: 6; box-shadow: 0 0 8px rgba(212,160,23,0.6); }
  .heading-display { text-align: center; font-size: 1.45rem; font-weight: 600; color: var(--gold); }
  .heading-sub { font-size: 0.85rem; color: var(--muted); margin-top: 2px; text-align: center; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; }
  .btn { padding: 10px 18px; border-radius: 10px; border: none; font-size: 0.95rem; font-weight: 500; cursor: pointer; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; flex: 1; min-width: 140px; }
  .btn-primary:disabled { background: #374151; color: #9ca3af; }
  .btn-secondary { background: #1f2937; color: var(--text); border: 1px solid var(--border); }
  .btn-success { background: var(--success); color: #fff; }
  .status-bar { width: 100%; padding: 8px 12px; border-radius: 8px; background: #1a1a1e; font-size: 0.8rem; color: var(--muted); text-align: center; }
  .status-bar.active { color: var(--success); }
  .status-bar.error { color: var(--danger); }
  .offset-row { display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; font-size: 0.85rem; color: var(--muted); }
  .offset-row input[type="number"] { width: 70px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: #111; color: var(--text); text-align: center; }
  .live-card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 14px 16px; }
  .live-card h2 { font-size: 0.9rem; color: var(--gold); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .live-card h2::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .live-content { font-size: 0.9rem; line-height: 1.65; color: var(--text); background: #1a1a1e; border-radius: 8px; padding: 12px; border-left: 3px solid var(--success); min-height: 4.5em; white-space: pre-line; }
  .gates-card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
  .gates-tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: none; }
  .gates-tabs::-webkit-scrollbar { display: none; }
  .gate-tab { flex: 0 0 auto; padding: 12px 14px; font-size: 0.85rem; color: var(--muted); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
  .gate-tab.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 600; }
  .gate-content { padding: 16px; font-size: 0.9rem; line-height: 1.7; color: var(--text); }
  .gate-content h3 { font-size: 1.05rem; color: var(--gold); margin-bottom: 10px; }
  .gate-content .section { margin-bottom: 14px; }
  .gate-content .section-title { font-size: 0.8rem; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .gate-content .plain { background: #1a1a1e; border-radius: 8px; padding: 12px 14px; margin-top: 6px; border-left: 3px solid var(--accent); white-space: pre-line; }
  .gate-content .example { background: #1a1a1e; border-radius: 8px; padding: 12px 14px; margin-top: 6px; border-left: 3px solid var(--gold); white-space: pre-line; }
  .gate-content .dynamic-box { background: #14261a; border-radius: 8px; padding: 12px 14px; margin-top: 6px; border-left: 3px solid var(--success); white-space: pre-line; }
  .gate-content .tag { display: inline-block; font-size: 0.72rem; padding: 2px 8px; border-radius: 4px; background: var(--tag-bg); color: #93c5fd; margin-right: 6px; margin-bottom: 6px; }
  .gate-content ul { padding-left: 1.2em; margin-top: 6px; }
  .gate-content li { margin-bottom: 4px; color: var(--muted); font-size: 0.88rem; }
  .lock-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.75); color: var(--gold); font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; z-index: 10; }
  .hidden { display: none !important; }
  footer { text-align: center; padding: 16px; font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>Sam.K-六門同參羅盤 · 即時對應白話</h1>

      </div>

    </div>
  </main>
  <footer>
    Sam.K-六門同參學術總盤 · 即時對應白話版 · 請於 HTTPS 環境使用<br>

  </footer>

<script>

  "壬":"丙","子":"午","癸":"丁","丑":"未","艮":"坤","寅":"申","甲":"庚","卯":"酉","乙":"辛","辰":"戌","巽":"乾","巳":"亥",

};
function getMountain(heading) {
  let h = ((heading % 360) + 360) % 360;
  return M24[Math.floor(((h + 7.5) % 360) / 15)];
}

  "甲":"陽木之氣，主成長條理。","卯":"正東木位，主仁與生機。","乙":"陰木之氣，主柔順延伸。",
  "辰":"濕土之氣，主蓄水變化。","巽":"風木之氣，主流通文采。","巳":"火氣初起，主文明展示。",
  "丙":"陽火之氣，主禮與光明。","午":"正南火位，主熱情名聲。","丁":"陰火之氣，主細膩文明。",
  "未":"燥土之氣，主收成穩定。","坤":"地土之氣，主包容承載。","申":"金氣初斂，主肅殺決斷。",
  "庚":"陽金之氣，主義與剛強。","酉":"正西金位，主收穫決斷。","辛":"陰金之氣，主細膩變革。",
  "戌":"燥土之氣，主收藏邊界。","乾":"天金之氣，主領袖剛健。","亥":"水氣初生，主智慧萌芽。"

const BAGUA_DIR = {
  "坎":"北(壬子癸)","坤":"西南(未坤申)","震":"東(甲卯乙)","巽":"東南(辰巽巳)",

};

function sitToBagua(sit) {
  if (["壬","子","癸"].includes(sit)) return "坎";
  if (["未","坤","申"].includes(sit)) return "坤";
  if (["甲","卯","乙"].includes(sit)) return "震";
  if (["辰","巽","巳"].includes(sit)) return "巽";
  if (["戌","乾","亥"].includes(sit)) return "乾";
  if (["庚","酉","辛"].includes(sit)) return "兌";
  if (["丑","艮","寅"].includes(sit)) return "艮";
  if (["丙","午","丁"].includes(sit)) return "離";
  return "—";
}

      const sitBagua = sitToBagua(sit);
      const faceBagua = sitToBagua(face);
      const faceMen = BAGUA_TO_MEN[faceBagua] || "—";
      const sitMen = BAGUA_TO_MEN[sitBagua] || "—";
      return `【即時對應】正針目前指向【${face}山】（向）→ 後天【${faceBagua}】卦 → 簡化對應為【${faceMen}門】\n` +
        `坐【${sit}山】→ 後天【${sitBagua}】卦 → 簡化對應為【${sitMen}門】\n\n` +
        `目前指針方向的門：【${faceMen}門】\n含義：${MEN_MEANING[faceMen] || "—"}\n\n` +
        `八門白話一覽：\n• 休門：${MEN_MEANING["休"]}\n• 生門：${MEN_MEANING["生"]}\n• 傷門：${MEN_MEANING["傷"]}\n• 杜門：${MEN_MEANING["杜"]}\n• 景門：${MEN_MEANING["景"]}\n• 死門：${MEN_MEANING["死"]}\n• 驚門：${MEN_MEANING["驚"]}\n• 開門：${MEN_MEANING["開"]}\n\n` +
        `說明：此為「後天卦固定對應八門」的簡化教學用法，方便轉動時立刻知道指針落在哪個門的特質。完整奇門排盤需依局數、時辰計算八門落宮，實際應用請再以專業排盤確認。`;
    }
  },
  6: {
    title: "易占星宿學",
    academic: "周易梅花易數＋28星宿宿曜",
    ring: "28星宿＋易占",
    plain: "白話就是看心卡在哪、今天星宿照哪、什麼事較易應驗。28宿每日輪值，梅花易數依時空起卦看心態與應事。",
    how: "查當日28宿，或依時間／觸機起梅花卦，結合當前方位。",
    example: "吉宿且事與特質相符可積極；凶宿或卦象阻滯則放緩、調心態。",
    points: ["28宿每日輪值", "梅花易數起卦", "重點：心卡與應事", "應用：決策與心境"],
    dynamic: (sit, face) => `正針指向【${face}山】（向），坐【${sit}山】。\n白話：可結合今日28宿與當前方位起卦。心中有卡住的問題，可依此方位與時間起梅花易數，看卦象與應事方向。重點在心態調整與決策參考，而非絕對預測。`
  }
};

let isActive = false, isLocked = false, currentHeading = 0, currentSit = "子", currentFace = "午", trueOffset = -4.2, activeGate = 1;
const canvas = document.getElementById("luopan");
const ctx = canvas.getContext("2d");
const statusBar = document.getElementById("statusBar");
const headingText = document.getElementById("headingText");
const mountainText = document.getElementById("mountainText");
const btnStart = document.getElementById("btnStart");
const offsetInput = document.getElementById("offsetInput");
const lockBadge = document.getElementById("lockBadge");
const liveText = document.getElementById("liveText");

function drawLuopan(heading) {
  const w = canvas.width, h = canvas.height, cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 8;
  ctx.clearRect(0,0,w,h);
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle="#0a0a0c"; ctx.fill();
  ctx.save(); ctx.translate(cx,cy); ctx.rotate((-heading*Math.PI)/180);
  [0.98,0.82,0.68,0.54,0.40,0.26].forEach((ratio,i)=>{
    ctx.beginPath(); ctx.arc(0,0,r*ratio,0,Math.PI*2);
    ctx.strokeStyle = i===0?"#555":"#333"; ctx.lineWidth = i===0?3:1.5; ctx.stroke();
  });
  ctx.font="bold 22px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let i=0;i<24;i++){
    const angle=(i*15-90)*Math.PI/180, rad=r*0.90;
    ctx.save(); ctx.translate(Math.cos(angle)*rad, Math.sin(angle)*rad); ctx.rotate(angle+Math.PI/2);
    ctx.fillStyle = getMountain(heading)===M24[i] ? "#d4a017" : "#c8c8d0";
    ctx.fillText(M24[i],0,0); ctx.restore();
  }
  for(let i=0;i<24;i++){
    const angle=(i*15-90)*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(Math.cos(angle)*r*0.78,Math.sin(angle)*r*0.78);
    ctx.lineTo(Math.cos(angle)*r*0.86,Math.sin(angle)*r*0.86); ctx.strokeStyle="#666"; ctx.lineWidth=2; ctx.stroke();
  }
  for(let i=0;i<72;i++){
    if(i%3===0) continue;
    const angle=(i*5-90)*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(Math.cos(angle)*r*0.70,Math.sin(angle)*r*0.70);
    ctx.lineTo(Math.cos(angle)*r*0.76,Math.sin(angle)*r*0.76); ctx.strokeStyle="#444"; ctx.lineWidth=1; ctx.stroke();
  }
  [{name:"北",angle:0},{name:"東",angle:90},{name:"南",angle:180},{name:"西",angle:270}].forEach(c=>{
    const angle=(c.angle-90)*Math.PI/180;
    ctx.fillStyle="#3b82f6"; ctx.fillText(c.name, Math.cos(angle)*r*0.58, Math.sin(angle)*r*0.58);
  });
  ctx.beginPath(); ctx.arc(0,0,r*0.22,0,Math.PI*2); ctx.fillStyle="#0d0d0f"; ctx.fill();
  ctx.strokeStyle="#d4a017"; ctx.lineWidth=2; ctx.stroke();
  ctx.font="14px sans-serif"; ctx.fillStyle="#9a9aa3"; ctx.fillText("六門",0,-8); ctx.fillText("同參",0,10);
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(cx,18); ctx.lineTo(cx-10,36); ctx.lineTo(cx+10,36); ctx.closePath(); ctx.fillStyle="#ef4444"; ctx.fill();
}

function updateUI(heading) {
  const face = getMountain(heading);
  const sit = OPPOSITE[face] || "—";
  currentSit = sit; currentFace = face;
  headingText.textContent = heading.toFixed(1) + "°";
  mountainText.textContent = `正針 · ${face}山 ｜ 坐${sit}向${face}`;
  liveText.textContent = `正針指向【${face}山】＝向（前方），對宮【${sit}山】＝坐（後方）。\n坐${sit}向${face}。${MOUNTAIN_TRAIT[sit]||""}\n（下方各門「即時動態解說」已盡量直接標示對應與白話）`;
  refreshGateDynamic();
}

function refreshGateDynamic() {
  const g = GATES[activeGate];
  const dynEl = document.getElementById("dynamicBlock");
  if (dynEl && g && g.dynamic) dynEl.textContent = g.dynamic(currentSit, currentFace);
}

function handleOrientation(e) {
  if (isLocked) return;
  let alpha = e.alpha;
  if (e.webkitCompassHeading != null) alpha = e.webkitCompassHeading;
  if (alpha == null) return;
  trueOffset = parseFloat(offsetInput.value) || 0;
  currentHeading = (alpha + trueOffset + 360) % 360;
  updateUI(currentHeading);
  drawLuopan(currentHeading);
}

function setStatus(msg, type="") {
  statusBar.textContent = msg;
  statusBar.className = "status-bar" + (type ? " " + type : "");
}

async function startGyro() {
  if (isActive) { stopGyro(); return; }
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    try {
      const state = await DeviceOrientationEvent.requestPermission();
      if (state !== "granted") { setStatus("使用者拒絕陀螺儀權限", "error"); return; }
    } catch (err) { setStatus("無法請求權限：" + err.message, "error"); return; }
  }
  window.addEventListener("deviceorientation", handleOrientation, true);
  isActive = true;
  btnStart.textContent = "停止陀螺儀";
  btnStart.classList.add("btn-success");
  setStatus("陀螺儀運行中 · 轉動手機即可看到對應白話更新", "active");
}

function stopGyro() {
  window.removeEventListener("deviceorientation", handleOrientation, true);
  isActive = false;
  btnStart.textContent = "一鍵啟動陀螺儀";
  btnStart.classList.remove("btn-success");
  setStatus("已停止感測器");
}

document.getElementById("btnLock").addEventListener("click", () => {
  isLocked = !isLocked;
  if (isLocked) {
    lockBadge.classList.remove("hidden");
    setStatus("方位已鎖定 · " + currentHeading.toFixed(1) + "°", "active");
  } else {
    lockBadge.classList.add("hidden");
    setStatus(isActive ? "陀螺儀運行中 · 轉動手機即可看到對應白話更新" : "尚未啟動感測器", isActive ? "active" : "");
  }
});

function showGate(id) {
  activeGate = parseInt(id, 10);
  const g = GATES[id];
  document.getElementById("gateContent").innerHTML = `
    <h3>${g.title}</h3>
    <div class="section"><span class="tag">學術來源</span>${g.academic}</div>
    <div class="section"><span class="tag">對應盤環</span>${g.ring}</div>
    <div class="section"><div class="section-title">白話完整解說</div><div class="plain">${g.plain}</div></div>
    <div class="section"><div class="section-title">如何使用本盤</div><div class="plain">${g.how}</div></div>
    <div class="section"><div class="section-title">實際例子</div><div class="example">${g.example}</div></div>
    <div class="section"><div class="section-title">即時動態解說（隨方位更新，已盡量直接標示）</div>
      <div class="dynamic-box" id="dynamicBlock">${g.dynamic(currentSit, currentFace)}</div></div>
    <div class="section"><div class="section-title">觀察重點</div><ul>${g.points.map(p=>`<li>${p}</li>`).join("")}</ul></div>`;
  document.querySelectorAll(".gate-tab").forEach(t => t.classList.toggle("active", t.dataset.gate === String(id)));
}

document.getElementById("gatesTabs").addEventListener("click", e => {
  if (e.target.classList.contains("gate-tab")) showGate(e.target.dataset.gate);
});
btnStart.addEventListener("click", startGyro);
document.getElementById("btnCalibrate").addEventListener("click", () => {
  alert("請將手機指向已知真北後，調整「真北偏移」數值。台灣常見參考 −4.2°。");
});
document.getElementById("btnInfo").addEventListener("click", () => {
  alert("1. 必須 HTTPS 開啟\n2. 一鍵啟動陀螺儀並允許權限\n3. 轉動手機，即時白話與各門動態區塊會更新\n4. 八宅已直接解釋五鬼絕命等含義\n5. 奇門已直接解釋八門吉凶特質\n6. 飛星說明：可鎖定坐向，但流年仍需另算才能得當年具體宮位");
});

showGate(1);
drawLuopan(0);
updateUI(0);
if (!window.DeviceOrientationEvent) {
  setStatus("此瀏覽器不支援 DeviceOrientation", "error");
  btnStart.disabled = true;
}
</script>
</body>
</html>
